name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run CI Pipeline
        uses: dagger/dagger-for-github@v6
        with:
          version: "0.18.12"
          verb: call
          args: ci --source=.
        
  release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: ci
    steps:
      - uses: actions/checkout@v4
      
      - name: Create Release
        uses: dagger/dagger-for-github@v6
        with:
          version: "0.18.12"
          verb: call
          args: release --source=. --version=${{ github.ref_name }} --github-token=env:GITHUB_TOKEN
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}